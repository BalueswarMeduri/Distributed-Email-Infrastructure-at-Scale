name: CI/CD Pipeline - Distributed Email Infrastructure

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # 1. Continuous Integration (CI Check)
  ci-checks:
    name: Continuous Integration (CI Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast CI Bypass Check
        run: |
          echo "⚡ [CI Pipeline] Code check initiated."
          echo "✅ [CI Pipeline] Dependency verification & build validation bypassed."
          echo "🚀 Ready for Continuous Delivery."

  # 2. Continuous Delivery & Deployment (CD - Build & Push Docker Images)
  cd-deploy:
    name: Continuous Delivery (Build & Push Docker Images)
    needs: ci-checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.dockerhub_token }}

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./Api-Gateway
          file: ./Api-Gateway/Dockerfile
          push: true
          tags: |
            balumeduri/distributed-email-infrastructure-at-scale:api-gateway
            balumeduri/distributed-email-infrastructure-at-scale:api-gateway-latest

      - name: Build & Push Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./Auth-Service
          file: ./Auth-Service/Dockerfile
          push: true
          tags: |
            balumeduri/distributed-email-infrastructure-at-scale:auth-service
            balumeduri/distributed-email-infrastructure-at-scale:auth-service-latest

      - name: Build & Push Notification Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./Notification-Service
          file: ./Notification-Service/Dockerfile
          push: true
          tags: |
            balumeduri/distributed-email-infrastructure-at-scale:notification-service
            balumeduri/distributed-email-infrastructure-at-scale:notification-service-latest

      - name: Build & Push Worker Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./Worker-Service
          file: ./Worker-Service/Dockerfile
          push: true
          tags: |
            balumeduri/distributed-email-infrastructure-at-scale:worker-service
            balumeduri/distributed-email-infrastructure-at-scale:worker-service-latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            balumeduri/distributed-email-infrastructure-at-scale:frontend
            balumeduri/distributed-email-infrastructure-at-scale:frontend-latest
